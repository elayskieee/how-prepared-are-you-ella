
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Prepared Are You?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <header>
            <h1>HOW PREPARED ARE YOU?</h1>
            <p>Think smart. Prepare well. Stay safe.</p>
        </header>

        <div class="game-info">
            <p>❤️ Lives: <span id="lives">3</span></p>
            <p>⭐ Score: <span id="score">0</span></p>
            <p>Level: <span id="level">1</span></p>
        </div>

        <main id="game">
            <h2>Are you ready?</h2>

            <p>
                Test your emergency preparedness knowledge,
                choose essential supplies, and solve problems.
            </p>

            <center><button id="start-button">Start Game</button>
                <button onclick="location.href='about.html'">About the Game</center>
        </main>

        <footer>
            <p>Every decision matters. Think smarter.</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
